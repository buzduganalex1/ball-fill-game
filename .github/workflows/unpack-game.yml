name: Unpack game

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract real game HTML
        shell: python
        run: |
          import re, base64, gzip, pathlib
          src = pathlib.Path('payload.html').read_text(encoding='utf-8')
          m = re.search(r"const b='([^']+)'", src)
          if not m:
              raise SystemExit('Compressed payload not found')
          b = re.sub(r'[^A-Za-z0-9+/=]', '', m.group(1))
          b = b.rstrip('=')
          b += '=' * ((4 - len(b) % 4) % 4)
          raw = base64.b64decode(b, validate=False)
          html = gzip.decompress(raw).decode('utf-8')
          if '<canvas' not in html or 'BALL_TYPES' not in html:
              raise SystemExit('Decoded file does not look like Ball Fill')
          pathlib.Path('index.html').write_text(html, encoding='utf-8')
          print(f'Unpacked {len(html):,} chars')
      - name: Commit unpacked game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish direct playable Ball Fill v33"
          git push
