<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><title>Ball Fill</title><style>html,body{margin:0;min-height:100%;background:#f5f7fa;font-family:system-ui,-apple-system,sans-serif;color:#3f4854}body{display:grid;place-items:center}.load{font-weight:900;text-align:center}.dot{width:42px;height:42px;border-radius:50%;margin:0 auto 14px;background:#67afd0;animation:p .7s ease-in-out infinite alternate}@keyframes p{to{transform:scale(1.35);box-shadow:0 0 28px #67afd088}}</style></head><body><div class="load"><div class="dot"></div>Loading Ball Fill…</div><script>(async()=>{try{const src=await fetch('./payload.html?fix=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+r.status);return r.text()});const m=src.match(/const b='([^']+)'/);if(!m)throw new Error('Game payload missing');let b=m[1].replace(/[^A-Za-z0-9+/=]/g,'');b=b.replace(/=+$/,'');b+='='.repeat((4-b.length%4)%4);const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Please update your browser');const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();if(!h.includes('<canvas')||!h.includes('BALL_TYPES'))throw new Error('Game data incomplete');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="load">Could not start the game.<br><small>'+e.message+'</small></div>'}})();</script></body></html>
